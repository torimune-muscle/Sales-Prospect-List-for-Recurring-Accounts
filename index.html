<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2f6b4f">
<title>営業先リスト</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232f6b4f'/><path d='M8 11h16M8 16h16M8 21h10' stroke='white' stroke-width='2.6' stroke-linecap='round'/></svg>">
<style>
:root {
  --bg: #f6f7f4;
  --surface: #ffffff;
  --surface-2: #f0f2ed;
  --text: #22281f;
  --muted: #6b7466;
  --line: #e2e6dd;
  --accent: #2f6b4f;
  --accent-soft: #e3efe8;
  --danger: #b4443a;
  --warn: #a8701a;
  --warn-soft: #fbf0dc;
  --shadow: 0 1px 2px rgba(20, 30, 20, .06), 0 4px 16px rgba(20, 30, 20, .05);
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141713; --surface: #1c201b; --surface-2: #252a23; --text: #e7ebe3; --muted: #9aa494;
    --line: #2f352d; --accent: #7cc49d; --accent-soft: #24372c; --danger: #e07a70; --warn: #e0b05a; --warn-soft: #3a3020;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg: #141713; --surface: #1c201b; --surface-2: #252a23; --text: #e7ebe3; --muted: #9aa494;
  --line: #2f352d; --accent: #7cc49d; --accent-soft: #24372c; --danger: #e07a70; --warn: #e0b05a; --warn-soft: #3a3020;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  font-size: 15px; line-height: 1.6;
}
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 80px; }

/* header */
.topbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.topbar h1 { font-size: 22px; margin: 0; letter-spacing: .02em; }
.topbar .spacer { flex: 1; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line);
  background: var(--surface); padding: 8px 14px; border-radius: 10px; cursor: pointer;
  min-height: 40px; text-decoration: none; color: var(--text); white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
:root[data-theme="dark"] .btn.primary { color: #10160f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #10160f; } }
.btn.danger { color: var(--danger); }
.btn.ghost { background: transparent; }
.btn:focus-visible, a:focus-visible, .row:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

/* toolbar */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.search { flex: 1; min-width: 200px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); min-height: 40px; }
.select { padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); min-height: 40px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 10px; scrollbar-width: thin; }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px;
  cursor: pointer; white-space: nowrap; font-size: 13px; min-height: 34px;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .chip[aria-pressed="true"] { color: #10160f; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip[aria-pressed="true"] { color: #10160f; } }
.chip .c { opacity: .7; margin-left: 4px; }

/* list */
.list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
.list-head, .row {
  display: grid; grid-template-columns: minmax(0, 2.2fr) 1.3fr 1fr 1.2fr 110px; gap: 12px; align-items: center; padding: 12px 16px;
}
.list-head { font-size: 12px; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--line); }
.list-head button { all: unset; cursor: pointer; }
.list-head button:hover { color: var(--text); }
.row { border-bottom: 1px solid var(--line); cursor: pointer; }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--surface-2); }
.row .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { color: var(--muted); font-size: 12px; }
.links { display: flex; gap: 6px; justify-content: flex-end; }
.ic {
  width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); display: grid; place-items: center;
  color: var(--muted); background: var(--surface); text-decoration: none;
}
.ic:hover { color: var(--accent); border-color: var(--accent); }
.ic svg { width: 16px; height: 16px; }
.ic.off { opacity: .25; pointer-events: none; }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); }

/* badge */
.badge {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 10px;
  border-radius: 999px; background: var(--s-bg); color: var(--s-fg); white-space: nowrap;
}
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.stale { color: var(--warn); background: var(--warn-soft); font-size: 11px; padding: 1px 8px; border-radius: 999px; margin-left: 6px; white-space: nowrap; }

/* detail */
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); text-decoration: none; margin-bottom: 12px; }
.back:hover { color: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 14px; }
.card h2 { font-size: 15px; margin: 0 0 12px; color: var(--muted); font-weight: 600; }
.detail-head { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
.detail-head h1 { margin: 0; font-size: 24px; flex: 1; min-width: 200px; word-break: break-all; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.kv .k { font-size: 12px; color: var(--muted); }
.kv .v { font-size: 16px; font-weight: 600; word-break: break-all; }
.linkbtn {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
  text-decoration: none; color: var(--text); background: var(--surface); min-height: 48px;
}
.linkbtn:hover { border-color: var(--accent); background: var(--accent-soft); }
.linkbtn .t { font-weight: 600; }
.linkbtn .u { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.linkbtn .txt { min-width: 0; flex: 1; }
.linkbtn svg { width: 18px; height: 18px; flex: none; color: var(--accent); }
.linkbtn.off { color: var(--muted); background: var(--surface-2); pointer-events: none; }
.linkbtn.off svg { color: var(--muted); }
.posts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.status-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.history { list-style: none; padding: 0; margin: 0; font-size: 13px; }
.history li { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.history li:last-child { border-bottom: 0; }
.history .d { color: var(--muted); min-width: 96px; }
.memo { white-space: pre-wrap; word-break: break-word; }

/* form */
.form { display: grid; gap: 14px; }
.field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.field .hint { font-size: 12px; color: var(--muted); margin-top: 2px; }
.input, .textarea {
  width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); min-height: 42px;
}
.textarea { min-height: 90px; resize: vertical; }
.input:invalid { border-color: var(--danger); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.req { color: var(--danger); margin-left: 2px; }

.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0;
  background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 10px; transition: .2s; pointer-events: none; z-index: 10;
}
.toast.show { opacity: 1; transform: translateX(-50%); }
.foot { margin-top: 18px; display: flex; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 12px; align-items: center; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ===== v2 デザイン改善 ===== */
.subtitle { color: var(--muted); font-size: 13px; margin-top: 2px; font-variant-numeric: tabular-nums; }
.c-dm, .c-upd, .meta, .history .d { font-variant-numeric: tabular-nums; }

/* データメニュー */
.menu { position: relative; }
.menu > summary { list-style: none; }
.menu > summary::-webkit-details-marker { display: none; }
.menu-panel {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 5; width: 260px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 8px 28px rgba(0,0,0,.12); padding: 6px;
}
.menu-panel button {
  display: block; width: 100%; text-align: left; border: 0; background: none; padding: 10px 12px; border-radius: 8px; cursor: pointer;
}
.menu-panel button:hover { background: var(--surface-2); }
.menu-panel .note { font-size: 12px; color: var(--muted); padding: 8px 12px 6px; border-top: 1px solid var(--line); margin-top: 4px; }

/* 要フォローのお知らせ */
.alert {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; cursor: pointer;
  background: var(--warn-soft); color: var(--warn); border: 1px solid transparent; border-radius: var(--radius);
  padding: 12px 16px; margin-bottom: 14px; font-weight: 600;
}
.alert:hover { border-color: var(--warn); }
.alert .cta { margin-left: auto; white-space: nowrap; font-size: 13px; }
.alert svg { width: 18px; height: 18px; flex: none; }

/* 空の状態 */
.hero { text-align: center; padding: 48px 20px; }
.hero h2 { font-size: 20px; margin: 12px 0 6px; color: var(--text); }
.hero p { color: var(--muted); margin: 0 0 22px; }
.hero .mark { width: 56px; height: 56px; border-radius: 16px; background: var(--accent-soft); color: var(--accent); display: inline-grid; place-items: center; }
.hero .mark svg { width: 28px; height: 28px; }
.flow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 720px; margin: 0 auto 24px; text-align: left; counter-reset: f; }
.flow li { list-style: none; background: var(--surface-2); border-radius: 10px; padding: 12px 14px; font-size: 13px; }
.flow li::before { counter-increment: f; content: "STEP " counter(f); display: block; font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: .06em; margin-bottom: 2px; }

/* 詳細ヘッダー */
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 13px; margin-top: 6px; }
.meta b { color: var(--text); font-weight: 600; }
.now { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
.now .lbl { font-size: 12px; color: var(--muted); }
.now .step { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.now .btn { margin-left: auto; }

/* ステッパー */
.stepper { display: grid; grid-template-columns: repeat(8, 1fr); margin: 14px 0 0; padding: 0; list-style: none; }
.stepper li { position: relative; }
.stepper li::before {
  content: ""; position: absolute; top: 9px; left: -50%; width: 100%; height: 2px; background: var(--line); z-index: 0;
}
.stepper li:first-child::before { display: none; }
.stepper li.done::before, .stepper li.current::before { background: var(--accent); }
.stepper button {
  all: unset; position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; cursor: pointer;
  font-size: 11.5px; color: var(--muted); text-align: center; line-height: 1.3; padding-bottom: 2px;
}
.stepper .dot {
  width: 20px; height: 20px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); box-sizing: border-box;
  display: grid; place-items: center; transition: transform .15s;
}
.stepper .dot svg { width: 12px; height: 12px; display: none; color: var(--surface); }
.stepper li.done .dot { background: var(--accent); border-color: var(--accent); }
.stepper li.done .dot svg { display: block; }
.stepper li.current .dot {
  border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft);
  background: radial-gradient(circle, var(--accent) 0 4px, var(--surface) 4.5px);
}
.stepper li.current button { color: var(--text); font-weight: 700; }
.stepper button:hover .dot { transform: scale(1.12); border-color: var(--accent); }
.stepper button:focus-visible .dot { outline: 2px solid var(--accent); outline-offset: 2px; }
.stepper-hint { font-size: 12px; color: var(--muted); margin-top: 10px; }

/* 未登録リンク（詳細） */
a.linkbtn.add-link { border-style: dashed; color: var(--muted); background: transparent; }
a.linkbtn.add-link svg { color: var(--muted); }

/* 編集：参考投稿 */
.post-list { display: grid; gap: 8px; }
.post-row { display: grid; grid-template-columns: 28px 1fr 40px; gap: 8px; align-items: center; }
.post-row .num { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1;
}
.icon-btn:hover { color: var(--danger); border-color: var(--danger); }
.add-post { justify-self: start; margin-left: 36px; border-style: dashed; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }

/* 編集：下に固定する保存バー */
.actions.sticky {
  position: sticky; bottom: 0; z-index: 4; margin: 0 -16px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--line);
}
.actions .danger { margin-right: auto; }
.dirty-note { font-size: 12px; color: var(--warn); align-self: center; }
.dirty-note[hidden] { display: none; }

@media (max-width: 720px) {
  .stepper .txt { display: none; }
  .stepper .dot { width: 18px; height: 18px; }
  .stepper li::before { top: 8px; }
  .now .btn { margin-left: 0; width: 100%; justify-content: center; }
  .flow { grid-template-columns: 1fr; }
  .grid3 { grid-template-columns: 1fr; }
  .alert .cta { display: none; }
  .topbar h1 { font-size: 20px; }
}

@media (max-width: 720px) {
  .list-head { display: none; }
  .row { grid-template-columns: 1fr auto; grid-template-areas: "name status" "dates links"; gap: 6px 10px; }
  .row .c-name { grid-area: name; min-width: 0; }
  .row .c-status { grid-area: status; }
  .row .c-dm { display: none; }
  .row .c-upd { grid-area: dates; font-size: 12px; }
  .row .c-links { grid-area: links; }
  .detail-head h1 { font-size: 20px; }
  .card { padding: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

<div class="toast" id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script type="module">
// ===== 定数 =====
const STORAGE_KEY = 'sales-leads-v1';
const POST_SLOTS = 10;
const STALE_DAYS = 14; // ステータス更新がこの日数止まっていたら「要フォロー」表示

const STATUSES = [
  { key: '未着手',        bg: '#eceee9', fg: '#5b6356', dbg: '#2a2f28', dfg: '#a9b2a3' },
  { key: 'First DM済み',  bg: '#e3edf9', fg: '#2c5d93', dbg: '#1e2b3a', dfg: '#8db8e6' },
  { key: '案件確認中',    bg: '#ece6f8', fg: '#5c3f97', dbg: '#2a2338', dfg: '#b9a2e6' },
  { key: '価格交渉中',    bg: '#fbeedb', fg: '#995d10', dbg: '#3a2c1a', dfg: '#e6b46a' },
  { key: '交渉済',        bg: '#fde6e1', fg: '#a3402f', dbg: '#3a2320', dfg: '#ea9888' },
  { key: '投稿作成中',    bg: '#fff5cc', fg: '#806400', dbg: '#363015', dfg: '#e3c95a' },
  { key: '投稿完了',      bg: '#ddf2f0', fg: '#1d6e66', dbg: '#183230', dfg: '#78cfc4' },
  { key: '対応完了',      bg: '#e3efe8', fg: '#2f6b4f', dbg: '#1f3127', dfg: '#7cc49d' },
];
const STATUS_INDEX = Object.fromEntries(STATUSES.map((s, i) => [s.key, i]));
const DONE = '対応完了';

// ===== ユーティリティ =====
const today = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};
const fmtDate = (s) => s ? s.replaceAll('-', '/') : '―';
const daysSince = (s) => {
  if (!s) return null;
  const [y, m, d] = s.split('-').map(Number);
  const t = new Date(); t.setHours(0, 0, 0, 0);
  return Math.round((t - new Date(y, m - 1, d)) / 86400000);
};
const uid = () => (crypto.randomUUID?.() ?? Date.now().toString(36) + Math.random().toString(36).slice(2));

// 入力されたURLを安全なhttp(s)リンクに整える。危険なスキームは捨てる
function normalizeUrl(raw) {
  const s = (raw ?? '').trim();
  if (!s) return '';
  const withScheme = /^[a-z][a-z0-9+.-]*:/i.test(s) ? s : `https://${s}`;
  try {
    const u = new URL(withScheme);
    return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : '';
  } catch { return ''; }
}
// @handle やユーザー名だけでもInstagramのURLにする
function normalizeInstagram(raw) {
  const s = (raw ?? '').trim();
  if (!s) return '';
  const handle = s.match(/^@?([A-Za-z0-9._]{1,30})$/);
  if (handle && !s.includes('.com')) return `https://www.instagram.com/${handle[1]}/`;
  return normalizeUrl(s);
}
const shortUrl = (u) => { try { const x = new URL(u); return x.host.replace(/^www\./, '') + (x.pathname === '/' ? '' : x.pathname); } catch { return u; } };

// DOM生成ヘルパー（innerHTMLを使わず、文字列は必ずtextとして入れる）
function h(tag, props = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props ?? {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') {
      for (const [prop, val] of Object.entries(v)) {
        if (prop.startsWith('--')) el.style.setProperty(prop, val); else el.style[prop] = val;
      }
    }
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'html') el.innerHTML = v; // 固定SVGアイコン専用
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat()) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

const ICONS = {
  web: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
  mail: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  ig: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
  play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="m10 8.5 5 3.5-5 3.5z" fill="currentColor"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></svg>',
  bell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>',

function badge(status) {
  const s = STATUSES[STATUS_INDEX[status] ?? 0];
  const dark = document.documentElement.dataset.theme === 'dark' ||
    (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  return h('span', { class: 'badge', style: { '--s-bg': dark ? s.dbg : s.bg, '--s-fg': dark ? s.dfg : s.fg } }, s.key);
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

// ===== データ =====
function blankLead() {
  return {
    id: uid(), name: '', siteUrl: '', contactUrl: '', instagramUrl: '',
    firstDmDate: '', status: '未着手', statusDate: today(),
    posts: Array(POST_SLOTS).fill(''), memo: '', history: [], createdAt: Date.now(),
  };
}
function sanitizeLead(x) {
  const b = blankLead();
  const posts = Array.isArray(x?.posts) ? x.posts.slice(0, POST_SLOTS).map(normalizeUrl) : [];
  while (posts.length < POST_SLOTS) posts.push('');
  return {
    ...b,
    id: typeof x?.id === 'string' && x.id ? x.id : b.id,
    name: String(x?.name ?? ''),
    siteUrl: normalizeUrl(x?.siteUrl), contactUrl: normalizeUrl(x?.contactUrl), instagramUrl: normalizeInstagram(x?.instagramUrl),
    firstDmDate: /^\d{4}-\d{2}-\d{2}$/.test(x?.firstDmDate) ? x.firstDmDate : '',
    status: STATUS_INDEX[x?.status] != null ? x.status : '未着手',
    statusDate: /^\d{4}-\d{2}-\d{2}$/.test(x?.statusDate) ? x.statusDate : '',
    posts, memo: String(x?.memo ?? ''),
    history: Array.isArray(x?.history) ? x.history.filter(e => e && STATUS_INDEX[e.status] != null).map(e => ({ status: e.status, date: String(e.date ?? '') })) : [],
    createdAt: Number(x?.createdAt) || Date.now(),
  };
}
const store = {
  load() {
    try { const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) ?? '[]'); return Array.isArray(raw) ? raw.map(sanitizeLead) : []; }
    catch { return []; }
  },
  save(list) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); return true; }
    catch { toast('保存できませんでした（ブラウザの保存領域を確認してください）'); return false; }
  },
};
let leads = store.load();
const findLead = (id) => leads.find(l => l.id === id);
function upsert(lead) {
  const i = leads.findIndex(l => l.id === lead.id);
  if (i >= 0) leads[i] = lead; else leads.unshift(lead);
  store.save(leads);
}
// ステータス変更：更新日を自動で今日に。First DM済みに進んだらFirst DM日も自動で入れる
function applyStatus(lead, status) {
  if (lead.status === status) return lead;
  const d = today();
  const next = { ...lead, status, statusDate: d, history: [...lead.history, { status, date: d }] };
  if (!next.firstDmDate && STATUS_INDEX[status] >= STATUS_INDEX['First DM済み']) next.firstDmDate = d;
  return next;
}
const isStale = (l) => l.status !== DONE && l.status !== '未着手' && (daysSince(l.statusDate) ?? 0) >= STALE_DAYS;

// ===== 一覧の状態（URLには載せず、画面内だけ保持） =====
const view = { q: '', status: 'すべて', sort: 'statusDate', dir: -1 };
try { Object.assign(view, JSON.parse(sessionStorage.getItem('sales-leads-view') ?? '{}')); } catch {}
const saveView = () => { try { sessionStorage.setItem('sales-leads-view', JSON.stringify(view)); } catch {} };

// ===== 画面：一覧 =====
function ListPage() {
  const counts = Object.fromEntries(STATUSES.map(s => [s.key, 0]));
  leads.forEach(l => counts[l.status]++);
  const active = leads.filter(l => l.status !== DONE && l.status !== '未着手').length;
  const negotiating = counts['案件確認中'] + counts['価格交渉中'];
  const stale = leads.filter(isStale).length;

  const listEl = h('div', { class: 'list', role: 'table', 'aria-label': '営業先一覧' });
  const sortBtn = (key, label) => h('button', {
    onclick: () => { view.dir = view.sort === key ? -view.dir : (key === 'name' || key === 'status' ? 1 : -1); view.sort = key; saveView(); renderList(); },
    'aria-label': `${label}で並べ替え`,
  }, label + (view.sort === key ? (view.dir > 0 ? ' ▲' : ' ▼') : ''));

  function rowsFiltered() {
    const q = view.q.trim().toLowerCase();
    return leads
      .filter(l => view.status === 'すべて' || (view.status === '要フォロー' ? isStale(l) : l.status === view.status))
      .filter(l => !q || [l.name, l.memo, l.siteUrl, l.instagramUrl].some(v => v.toLowerCase().includes(q)))
      .sort((a, b) => {
        const k = view.sort;
        const va = k === 'status' ? STATUS_INDEX[a.status] : (a[k] || '');
        const vb = k === 'status' ? STATUS_INDEX[b.status] : (b[k] || '');
        if (va === vb) return b.createdAt - a.createdAt;
        if (va === '') return 1; if (vb === '') return -1;
        return (va > vb ? 1 : -1) * view.dir;
      });
  }

  function renderList() {
    const rows = rowsFiltered();
    const head = h('div', { class: 'list-head', role: 'row' },
      h('div', {}, sortBtn('name', '企業名')), h('div', {}, sortBtn('status', 'ステータス')),
      h('div', {}, sortBtn('firstDmDate', 'First DM日')), h('div', {}, sortBtn('statusDate', 'ステータス更新日')),
      h('div', { style: { textAlign: 'right' } }, 'リンク'));
    // 未登録のリンクは出さない（行を静かに保つ）
    const iconLink = (url, icon, label) => url ? h('a', {
      class: 'ic', href: url, target: '_blank', rel: 'noopener noreferrer',
      title: label, 'aria-label': `${label}を開く`, html: ICONS[icon], onclick: (e) => e.stopPropagation(),
    }) : null;
    const body = rows.length ? rows.map(l => {
      const ds = daysSince(l.statusDate);
      return h('div', {
        class: 'row', role: 'row', tabindex: 0,
        onclick: () => go(`#/lead/${l.id}`),
        onkeydown: (e) => { if (e.key === 'Enter') go(`#/lead/${l.id}`); },
      },
        h('div', { class: 'c-name' }, h('div', { class: 'name' }, l.name || '（企業名なし）'),
          l.memo ? h('div', { class: 'sub', style: { whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' } }, l.memo.split('\n')[0]) : null),
        h('div', { class: 'c-status' }, badge(l.status)),
        h('div', { class: 'c-dm' }, fmtDate(l.firstDmDate)),
        h('div', { class: 'c-upd' }, fmtDate(l.statusDate),
          ds != null && l.status !== DONE ? h('span', { class: 'sub' }, ` (${ds}日前)`) : null,
          isStale(l) ? h('span', { class: 'stale' }, '要フォロー') : null),
        h('div', { class: 'c-links links' },
          iconLink(l.siteUrl, 'web', '企業サイト'), iconLink(l.contactUrl, 'mail', '問い合わせ先'), iconLink(l.instagramUrl, 'ig', 'Instagram')),
      );
    }) : [h('div', { class: 'empty' },
      '条件に合う営業先がありません',
      h('div', { style: { marginTop: '10px' } },
        h('button', { class: 'btn', onclick: () => { view.q = ''; view.status = 'すべて'; saveView(); render(); } }, '絞り込みを解除')))];
    listEl.replaceChildren(head, ...body);
    countEl.textContent = `${rows.length}件表示 / 全${leads.length}件`;
  }

  const chip = (key, n) => h('button', {
    class: 'chip', 'aria-pressed': String(view.status === key),
    onclick: () => { view.status = key; saveView(); render(); },
  }, key, h('span', { class: 'c' }, n));

  const countEl = h('div', { class: 'visually-hidden', 'aria-live': 'polite' });
  const search = h('input', {
    class: 'search', type: 'search', placeholder: '企業名・メモで検索', value: view.q, 'aria-label': '検索',
    oninput: (e) => { view.q = e.target.value; saveView(); clearTimeout(search._t); search._t = setTimeout(renderList, 120); },
  });

  const topbar = h('div', { class: 'topbar' },
    h('div', {}, h('h1', {}, '営業先リスト'),
      leads.length ? h('div', { class: 'subtitle' }, `全${leads.length}件 ・ 進行中 ${active}件 ・ 確認中/交渉中 ${negotiating}件`) : null),
    h('div', { class: 'spacer' }),
    DataMenu(),
    h('a', { class: 'btn primary', href: '#/new' }, '＋ 営業先を追加'));

  if (!leads.length) {
    return [topbar, h('div', { class: 'card hero' },
      h('div', { class: 'mark', html: ICONS.list }),
      h('h2', {}, '最初の営業先を登録しましょう'),
      h('p', {}, '1社1行で、DMを送った日から投稿完了までの進み具合をまとめて管理できます'),
      h('ol', { class: 'flow' },
        h('li', {}, '#PRで検索して、タイアップ投稿をしている企業を見つける'),
        h('li', {}, '企業を追加して、ファーストDMを送ったら「First DM済み」に'),
        h('li', {}, '返信が来たら、ステータスを1つずつ進める')),
      h('a', { class: 'btn primary', href: '#/new' }, '＋ 営業先を追加'))];
  }

  const page = [
    topbar,
    stale ? h('button', {
      class: 'alert', onclick: () => { view.status = '要フォロー'; view.q = ''; saveView(); render(); },
    }, h('span', { html: ICONS.bell }), `${stale}件の営業先が${STALE_DAYS}日以上動いていません。もう一度連絡してみましょう`, h('span', { class: 'cta' }, '表示する →')) : null,
    h('div', { class: 'toolbar' }, search),
    h('div', { class: 'chips', role: 'group', 'aria-label': 'ステータスで絞り込み' },
      chip('すべて', leads.length), stale ? chip('要フォロー', stale) : null,
      ...STATUSES.filter(s => counts[s.key] || view.status === s.key).map(s => chip(s.key, counts[s.key]))),
    listEl, countEl,
  ];
  renderList();
  return page;
}

// ===== 画面：詳細 =====
function DetailPage(id) {
  const lead = findLead(id);
  if (!lead) return NotFound();
  const idx = STATUS_INDEX[lead.status];
  const ds = daysSince(lead.statusDate);

  const editHref = `#/lead/${lead.id}/edit`;
  // 未登録は「押すと編集へ」の点線ボタンにして、次の行動が分かるようにする
  const linkBtn = (url, icon, title) => url
    ? h('a', { class: 'linkbtn', href: url, target: '_blank', rel: 'noopener noreferrer' },
        h('span', { html: ICONS[icon] }), h('span', { class: 'txt' }, h('div', { class: 't' }, title), h('div', { class: 'u' }, shortUrl(url))), h('span', { html: ICONS.ext }))
    : h('a', { class: 'linkbtn add-link', href: editHref },
        h('span', { html: ICONS.plus }), h('span', { class: 'txt' }, h('div', { class: 't' }, title), h('div', { class: 'u' }, '未登録 ・ 押して登録')));

  const setStatus = (s) => {
    if (s === lead.status) return;
    upsert(applyStatus(lead, s)); toast(`ステータスを「${s}」に更新しました`); render();
  };
  const nextStatus = STATUSES[idx + 1]?.key;
  const posts = lead.posts.map((u, i) => [u, i]).filter(([u]) => u);
  const ago = (d) => d == null ? '' : d === 0 ? '（今日）' : `（${d}日前）`;

  const stepper = h('ol', { class: 'stepper', 'aria-label': 'ステータス（押すと変更できます）' },
    ...STATUSES.map((s, i) => h('li', { class: i < idx ? 'done' : i === idx ? 'current' : '' },
      h('button', {
        type: 'button', title: s.key, 'aria-label': `${s.key}${i === idx ? '（現在）' : 'に変更'}`,
        'aria-current': i === idx ? 'step' : null, onclick: () => setStatus(s.key),
      }, h('span', { class: 'dot', html: ICONS.check }), h('span', { class: 'txt' }, s.key)))));

  return [
    h('a', { class: 'back', href: '#/' }, '← 一覧に戻る'),
    h('div', { class: 'card' },
      h('div', { class: 'detail-head' },
        h('h1', {}, lead.name || '（企業名なし）'),
        h('a', { class: 'btn', href: editHref }, '編集')),
      h('div', { class: 'meta' },
        h('span', {}, 'First DM ', h('b', {}, fmtDate(lead.firstDmDate)), lead.firstDmDate ? ago(daysSince(lead.firstDmDate)) : ''),
        h('span', {}, 'ステータス更新 ', h('b', {}, fmtDate(lead.statusDate)), ago(ds),
          isStale(lead) ? h('span', { class: 'stale' }, '要フォロー') : null)),
      h('div', { class: 'now' },
        h('span', { class: 'lbl' }, '現在のステータス'), badge(lead.status),
        h('span', { class: 'step' }, `${idx + 1} / ${STATUSES.length}`),
        nextStatus
          ? h('button', { class: 'btn primary', onclick: () => setStatus(nextStatus) }, `次へ進める：${nextStatus}`)
          : h('span', { class: 'step', style: { marginLeft: 'auto' } }, 'すべて完了しました')),
      stepper,
      h('div', { class: 'stepper-hint' }, '丸を押すと、そのステータスに直接変更できます（更新日は今日になります）')),
    h('div', { class: 'card' },
      h('h2', {}, '企業リンク'),
      h('div', { class: 'grid2' },
        linkBtn(lead.siteUrl, 'web', '企業サイト'),
        linkBtn(lead.contactUrl, 'mail', '問い合わせ先'),
        linkBtn(lead.instagramUrl, 'ig', 'Instagram'))),
    h('div', { class: 'card' },
      h('h2', {}, `参考投稿（${posts.length} / ${POST_SLOTS}）`),
      posts.length
        ? h('div', { class: 'posts' }, ...posts.map(([u], n) => linkBtn(u, 'play', `参考投稿 ${n + 1}`)))
        : h('a', { class: 'linkbtn add-link', href: editHref, style: { maxWidth: '320px' } },
            h('span', { html: ICONS.plus }), h('span', { class: 'txt' }, h('div', { class: 't' }, '参考投稿を登録'), h('div', { class: 'u' }, `最大${POST_SLOTS}件まで`)))),
    lead.memo ? h('div', { class: 'card' }, h('h2', {}, 'メモ'), h('div', { class: 'memo' }, lead.memo)) : null,
    lead.history.length ? h('div', { class: 'card' },
      h('h2', {}, 'ステータス履歴'),
      h('ul', { class: 'history' }, ...[...lead.history].reverse().map(e => h('li', {}, h('span', { class: 'd' }, fmtDate(e.date)), badge(e.status))))) : null,
  ];
}

// ===== 画面：追加・編集 =====
function EditPage(id) {
  const isNew = !id;
  const base = isNew ? blankLead() : findLead(id);
  if (!base) return NotFound();

  const field = (label, input, hint, required) => h('div', { class: 'field' },
    h('label', { for: input.id }, label, required ? h('span', { class: 'req' }, '*') : null), input, hint ? h('div', { class: 'hint' }, hint) : null);
  const inp = (id, value, attrs = {}) => h('input', { class: 'input', id, value: value ?? '', ...attrs });

  const fName = inp('f-name', base.name, { required: true, autocomplete: 'off', placeholder: '例）株式会社〇〇' });
  const fSite = inp('f-site', base.siteUrl, { inputmode: 'url', placeholder: 'https://example.co.jp' });
  const fContact = inp('f-contact', base.contactUrl, { inputmode: 'url', placeholder: '問い合わせフォームのURL' });
  const fIg = inp('f-ig', base.instagramUrl, { inputmode: 'url', placeholder: 'https://www.instagram.com/xxx/ または @xxx' });
  const fDm = inp('f-dm', base.firstDmDate, { type: 'date' });
  const fStatus = h('select', { class: 'input', id: 'f-status' }, ...STATUSES.map(s => h('option', { value: s.key, selected: s.key === base.status }, s.key)));
  const fStatusDate = inp('f-sdate', base.statusDate, { type: 'date' });
  const fMemo = h('textarea', { class: 'textarea', id: 'f-memo', placeholder: '担当者名、提示金額、やり取りの要点など' }, base.memo);

  // 未保存の変更を検知して、離脱時に確認する
  let dirty = false;
  const dirtyNote = h('span', { class: 'dirty-note', hidden: true }, '未保存の変更があります');
  const markDirty = () => { if (!dirty) { dirty = true; dirtyNote.hidden = false; } };
  leaveGuard = () => !dirty || confirm('保存していない変更があります。破棄して移動しますか？');

  // ステータスを変えたら更新日を今日に寄せる（手で直すこともできる）
  fStatus.addEventListener('change', () => { fStatusDate.value = today(); });

  // 参考投稿：入力済み＋空欄1つだけ見せ、必要に応じて増やす
  const postVals = base.posts.filter(Boolean);
  if (postVals.length < POST_SLOTS) postVals.push('');
  const postsBox = h('div', { class: 'post-list' });
  function renderPosts(focusIndex) {
    postsBox.replaceChildren(
      ...postVals.map((v, i) => h('div', { class: 'post-row' },
        h('span', { class: 'num' }, i + 1),
        h('input', {
          class: 'input', id: `f-post-${i}`, value: v, inputmode: 'url', placeholder: 'https://www.instagram.com/reel/...',
          'aria-label': `参考投稿 ${i + 1} のURL`,
          oninput: (e) => { postVals[i] = e.target.value; },
          onpaste: (e) => {
            // 複数のURLをまとめて貼り付けたら、1件ずつに分ける
            const urls = (e.clipboardData?.getData('text') ?? '').split(/\s+/).filter(Boolean);
            if (urls.length < 2) return;
            e.preventDefault();
            postVals.splice(i, 1, ...urls);
            postVals.splice(POST_SLOTS);
            markDirty(); renderPosts(Math.min(i + urls.length, POST_SLOTS) - 1);
          },
        }),
        h('button', {
          type: 'button', class: 'icon-btn', title: '削除', 'aria-label': `参考投稿 ${i + 1} を削除`,
          onclick: () => { postVals.splice(i, 1); if (!postVals.length) postVals.push(''); markDirty(); renderPosts(); },
        }, '×'))),
      postVals.length < POST_SLOTS
        ? h('button', { type: 'button', class: 'btn add-post', onclick: () => { postVals.push(''); renderPosts(postVals.length - 1); } },
            `＋ 投稿URLを追加（あと${POST_SLOTS - postVals.length}件）`)
        : null);
    if (focusIndex != null) postsBox.querySelectorAll('input')[focusIndex]?.focus();
  }
  renderPosts();
  const postInputs = () => [...postsBox.querySelectorAll('input')];

  function onSubmit(e) {
    e.preventDefault();
    const name = fName.value.trim();
    if (!name) { fName.focus(); toast('企業名を入力してください'); return; }
    const bad = [[fSite, normalizeUrl], [fContact, normalizeUrl], [fIg, normalizeInstagram], ...postInputs().map(p => [p, normalizeUrl])]
      .find(([el, fn]) => el.value.trim() && !fn(el.value));
    if (bad) { bad[0].focus(); toast('URLの形式を確認してください'); return; }

    let lead = {
      ...base, name,
      siteUrl: normalizeUrl(fSite.value), contactUrl: normalizeUrl(fContact.value), instagramUrl: normalizeInstagram(fIg.value),
      firstDmDate: fDm.value, memo: fMemo.value.trim(),
      posts: [...postVals.map(normalizeUrl).filter(Boolean), ...Array(POST_SLOTS).fill('')].slice(0, POST_SLOTS),
    };
    if (fStatus.value !== base.status || isNew) {
      lead = { ...lead, status: fStatus.value, statusDate: fStatusDate.value || today(),
        history: [...base.history, { status: fStatus.value, date: fStatusDate.value || today() }] };
      if (!lead.firstDmDate && STATUS_INDEX[fStatus.value] >= STATUS_INDEX['First DM済み']) lead.firstDmDate = lead.statusDate;
    } else {
      lead.statusDate = fStatusDate.value;
    }
    upsert(lead);
    dirty = false;
    toast(isNew ? '追加しました' : '保存しました');
    go(`#/lead/${lead.id}`, true);
  }

  function onDelete() {
    if (!confirm(`「${base.name}」を削除しますか？（元に戻せません）`)) return;
    leads = leads.filter(l => l.id !== base.id); store.save(leads);
    dirty = false;
    toast('削除しました'); go('#/', true);
  }

  const cancelHref = isNew ? '#/' : `#/lead/${base.id}`;
  const form = h('form', { class: 'form', onsubmit: onSubmit, novalidate: true, oninput: markDirty, onchange: markDirty },
    h('div', { class: 'card form' },
      h('h2', {}, '基本情報'),
      field('企業の名前', fName, null, true),
      h('div', { class: 'grid2' },
        field('企業のURL', fSite), field('問い合わせ先URL', fContact, 'フォームやメールの窓口ページ')),
      field('企業のInstagram', fIg, '@アカウント名だけでもOKです')),
    h('div', { class: 'card form' },
      h('h2', {}, '進捗'),
      h('div', { class: 'grid3' },
        field('ステータス', fStatus),
        field('ステータス更新日', fStatusDate, 'ステータスを変えると今日になります'),
        field('First DM日', fDm, 'DM済み以降に進めると自動で入ります'))),
    h('div', { class: 'card form' },
      h('h2', {}, `参考投稿URL（最大${POST_SLOTS}件）`),
      h('div', { class: 'hint', style: { fontSize: '12px', color: 'var(--muted)', marginTop: '-6px' } }, '複数のURLをまとめて貼り付けると、1件ずつに分かれます'),
      postsBox),
    h('div', { class: 'card form' }, h('h2', {}, 'メモ'), fMemo),
    h('div', { class: 'actions sticky' },
      isNew ? null : h('button', { type: 'button', class: 'btn danger ghost', onclick: onDelete }, '削除'),
      dirtyNote,
      h('a', { class: 'btn', href: cancelHref }, 'キャンセル'),
      h('button', { type: 'submit', class: 'btn primary' }, isNew ? '追加する' : '保存する')));

  queueMicrotask(() => (isNew ? fName : null)?.focus());
  return [
    h('a', { class: 'back', href: cancelHref }, '← 戻る'),
    h('div', { class: 'topbar' }, h('h1', {}, isNew ? '営業先を追加' : `${base.name} を編集`)),
    form,
  ];
}

function NotFound() {
  return [h('a', { class: 'back', href: '#/' }, '← 一覧に戻る'), h('div', { class: 'card empty' }, '指定の営業先が見つかりませんでした')];
}

// ===== バックアップ・CSV =====
function download(name, content, type) {
  const url = URL.createObjectURL(new Blob([content], { type }));
  const a = h('a', { href: url, download: name }); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportJson() {
  download(`営業先リスト_バックアップ_${today()}.json`, JSON.stringify({ app: 'sales-leads', version: 1, leads }, null, 2), 'application/json');
  toast('バックアップを保存しました');
}
function exportCsv() {
  const cols = ['企業名', '企業URL', '問い合わせ先URL', 'Instagram', 'First DM日', 'ステータス', 'ステータス更新日',
    ...Array.from({ length: POST_SLOTS }, (_, i) => `参考投稿${i + 1}`), 'メモ'];
  const esc = (v) => {
    let s = String(v ?? '');
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // Excelの数式扱いを防ぐ
    return `"${s.replaceAll('"', '""')}"`;
  };
  const rows = leads.map(l => [l.name, l.siteUrl, l.contactUrl, l.instagramUrl, l.firstDmDate, l.status, l.statusDate, ...l.posts, l.memo]);
  download(`営業先リスト_${today()}.csv`, '﻿' + [cols, ...rows].map(r => r.map(esc).join(',')).join('\r\n'), 'text/csv');
  toast('CSVを出力しました');
}
document.getElementById('importFile').addEventListener('change', async (e) => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const incoming = (Array.isArray(data) ? data : data?.leads);
    if (!Array.isArray(incoming)) throw new Error();
    const list = incoming.map(sanitizeLead);
    const mode = leads.length
      ? confirm(`${list.length}件を読み込みます。\n\nOK：今のデータに追加（同じ営業先は上書き）\nキャンセル：読み込みをやめる`)
      : true;
    if (!mode) return;
    const map = new Map(leads.map(l => [l.id, l]));
    list.forEach(l => map.set(l.id, l));
    leads = [...map.values()]; store.save(leads);
    toast(`${list.length}件を読み込みました`); render();
  } catch { toast('読み込めませんでした（バックアップのJSONファイルを選んでください）'); }
});

// ===== ルーター =====
function go(hash, replace = false) {
  if (replace) { history.replaceState(null, '', hash); render(); }
  else if (location.hash === hash) render();
  else location.hash = hash;
}
function route() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (parts[0] === 'new') return { page: EditPage(null), title: '営業先を追加' };
  if (parts[0] === 'lead' && parts[1] && parts[2] === 'edit') return { page: EditPage(parts[1]), title: '編集' };
  if (parts[0] === 'lead' && parts[1]) return { page: DetailPage(parts[1]), title: findLead(parts[1])?.name || '営業先' };
  return { page: ListPage(), title: null };
}
let lastHash = null;
let leaveGuard = null; // 編集画面が未保存の変更を持っているとき、離脱を確認する関数
function render() {
  leaveGuard = null;
  const { page, title } = route();
  document.getElementById('app').replaceChildren(...[page].flat().filter(Boolean));
  document.title = title ? `${title} | 営業先リスト` : '営業先リスト';
  if (lastHash !== location.hash) { window.scrollTo(0, 0); lastHash = location.hash; }
}
window.addEventListener('hashchange', () => {
  if (leaveGuard && !leaveGuard()) { history.replaceState(null, '', lastHash); return; }
  render();
});
window.addEventListener('beforeunload', (e) => {
  if (document.querySelector('.dirty-note:not([hidden])')) { e.preventDefault(); e.returnValue = ''; }
});
// 別タブで更新されたら反映
window.addEventListener('storage', (e) => { if (e.key === STORAGE_KEY) { leads = store.load(); render(); } });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', render);
render();
</script>
